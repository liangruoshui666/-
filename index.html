<body><div class="app">
<header class="header"><div class="brand"><div class="emblem">✦</div><div class="brandname">小王子的星际画室<small>THE LITTLE PRINCE · 3D DREAMSCAPE</small></div></div><div class="headright"><div class="live"><i></i>星球正在呼吸</div><button class="headlink" id="resetView">重置视角 ↺</button></div></header>

<div class="story" id="story"><div class="story-kicker">FIELD NOTE · B-612</div><h2 id="storyTitle">玫瑰的秘密</h2><p id="storyText">在这颗很小很小的星球上，一朵玫瑰拥有自己的季节。点一点星球上的角色，听听他们的故事。</p><div class="rule"></div></div>

<div class="side-tools"><button class="toolbtn primary" id="drawMode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m4 20 4.5-1 10.8-10.8a2.1 2.1 0 0 0-3-3L5.5 16 4 20Z"/><path d="m14.5 6.5 3 3"/></svg><span class="txt">星迹画笔</span></button><button class="toolbtn" id="clear"><span>⌫</span><span class="txt">擦除星迹</span></button><button class="toolbtn" id="save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v12m-5-5 5 5 5-5M4 17v3h16v-3"/></svg><span class="txt">保存作品</span></button></div></main>
<footer class="bottom"><div class="legend"><span class="legend-item"><i class="rose"></i>玫瑰</span><span class="legend-item"><i class="fox"></i>狐狸</span><span class="legend-item"><i></i>小王子</span></div><div class="footnote">献给所有曾经是孩子的大人</div><div class="palette"><span class="palette-label">画笔色彩</span><button class="color gold sel" data-color="#efd18e" aria-label="星金"></button><button class="color cyan" data-color="#90d9e3" aria-label="月光青"></button><button class="color rose" data-color="#f3a3b3" aria-label="玫瑰粉"></button><button class="color white" data-color="#f1f0ea" aria-label="星雾白"></button></div></footer><div class="toast" id="toast"></div></div>
<script>
(()=>{const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');let w=0,h=0,dpr=1,yaw=-.38,pitch=.16,dist=12.8,targetYaw=yaw,targetPitch=pitch,zoom=1,drag=false,last={x:0,y:0},drawing=false,brush='#efd18e',strokes=[],current=null,hover=null,t=0;
const TAU=Math.PI*2, stars=Array.from({length:260},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.25+.15,a:Math.random()*.75+.15,ph:Math.random()*TAU}));
const objects=[{id:'rose',name:'玫瑰的秘密',title:'玫瑰的秘密',text:'在这颗很小很小的星球上，一朵玫瑰拥有自己的季节。她的独一无二，来自那些被认真照料的时刻。',color:'#ed9aa7',pos:[-1.45,1.85,.5]},{id:'prince',name:'小王子',title:'小王子的旅程',text:'他从一颗小小的星球出发，带着问题穿过许多星辰。旅途让他渐渐懂得，目光停留在哪里，哪里便有了意义。',color:'#efd18e',pos:[.15,1.8,.75]},{id:'fox',name:'狐狸',title:'狐狸的约定',text:'狐狸在麦田边等待。一次相遇，会让原本寻常的颜色和声音，从此变得不同。',color:'#e4a77c',pos:[1.75,1.45,.35]}];
const planets=[{id:'king',name:'国王的星球',short:'国王',title:'一位国王的星球',text:'这里住着一位想要统治星辰的国王。他相信，每个命令都要顺着事物原本的方向。',pos:[-4.7,2.35,-.4],r:.48,color:'#8872b7',light:'#d5c0ed',dark:'#40365d'},{id:'vain',name:'爱慕虚荣者的星球',short:'掌声',title:'爱慕虚荣者的星球',text:'这颗小行星上，掌声总是刚刚好响起。它提醒旅人：被看见，与真正理解彼此，并不是同一回事。',pos:[4.65,2.45,-.5],r:.43,color:'#b66f73',light:'#efb6a5',dark:'#573f5b'},{id:'drunk',name:'酒鬼的星球',short:'回声',title:'酒鬼的星球',text:'一颗安静的紫色小行星，回荡着一个人不愿回答自己的问题。星光落下，像是轻轻的叹息。',pos:[-4.55,-2.5,-.45],r:.39,color:'#605e9c',light:'#aaa8dc',dark:'#282d58'},{id:'merchant',name:'商人的星球',short:'星数',title:'商人的星球',text:'商人忙着数数，把遥远的星星都记在账本里。可星星不需要被拥有，也依然会为夜空发光。',pos:[4.7,-2.5,.35],r:.5,color:'#9d8059',light:'#eed28e',dark:'#514438'},{id:'lamp',name:'点灯人的星球',short:'灯火',title:'点灯人的星球',text:'这颗星球转得很快，点灯人却仍准时点亮灯火。那一簇小小的光，是对约定温柔的坚持。',pos:[-.95,4.15,-.45],r:.43,color:'#4a8e9e',light:'#a5e3e3',dark:'#263c61'},{id:'geo',name:'地理学家的星球',short:'地图',title:'地理学家的星球',text:'地图记录山川，却不记录花朵的短暂。要认识一颗星球，有时得亲自走出去看看。',pos:[1.2,-4.1,-.35],r:.53,color:'#577f78',light:'#b8d8a9',dark:'#2c4b53'}];
let starsCache=[];
function resize(){const r=stage.getBoundingClientRect();w=r.width;h=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);render()}
function project(v){const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),x=v[0],y=v[1],z=v[2],right=x*cy-z*sy,forward=x*sy+z*cy,up=y*cp-forward*sp,depth=dist/zoom-(y*sp+forward*cp),f=Math.min(w,h)*1.02;return{x:w*.5+right*f/depth,y:h*.54-up*f/depth,s:f/depth,z:depth}}
function path3(points,close=true){ctx.beginPath();points.forEach((p,i)=>{const q=project(p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});if(close)ctx.closePath()}
function line3(points,color,width,alpha=1){ctx.beginPath();points.forEach((p,i)=>{const q=project(p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.strokeStyle=color;ctx.lineWidth=width;ctx.globalAlpha=alpha;ctx.stroke();ctx.globalAlpha=1}
function spherePoint(lat,lon,rx,ry,rz,center=[0,0,0]){return[center[0]+rx*Math.cos(lat)*Math.cos(lon),center[1]+ry*Math.sin(lat),center[2]+rz*Math.cos(lat)*Math.sin(lon)]}
function drawGlobe(){const c=project([0,0,0]),rx=3.55*c.s,ry=2.08*c.s;ctx.save();ctx.translate(c.x,c.y);ctx.rotate(-.09);const g=ctx.createRadialGradient(-rx*.34,-ry*.48,rx*.05,rx*.14,ry*.18,rx*1.1);g.addColorStop(0,'#8294b3');g.addColorStop(.2,'#455675');g.addColorStop(.56,'#263552');g.addColorStop(.82,'#17243f');g.addColorStop(1,'#0c142a');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,TAU);ctx.fill();ctx.restore();
for(let k=-2;k<=2;k++){let lat=k*.25,pts=[];for(let j=0;j<=64;j++)pts.push(spherePoint(lat,j/64*TAU,3.5,2.04,3.22));line3(pts,k===0?'rgba(200,215,239,.2)':'rgba(190,207,234,.09)',.7)}
for(let l=0;l<6;l++){let lon=l*TAU/6,pts=[];for(let j=0;j<=64;j++)pts.push(spherePoint(-Math.PI/2+j/64*Math.PI,lon,3.5,2.04,3.22));line3(pts,'rgba(190,207,234,.085)',.65)}
// tiny volcanoes and rolling hills
const hill=(x,z,r,top)=>{let base=project([x,0,z]),scale=base.s;ctx.fillStyle='#34415b';ctx.beginPath();ctx.ellipse(base.x,base.y,scale*r,scale*r*.36,0,0,TAU);ctx.fill();ctx.fillStyle='#4a5367';ctx.beginPath();ctx.moveTo(base.x-scale*r*.66,base.y);ctx.quadraticCurveTo(base.x-scale*r*.35,base.y-scale*top,base.x,base.y-scale*top);ctx.quadraticCurveTo(base.x+scale*r*.35,base.y-scale*top,base.x+scale*r*.66,base.y);ctx.fill();ctx.strokeStyle='rgba(235,211,165,.48)';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(base.x,base.y-scale*top*.12,scale*r*.18,scale*top*.13,0,Math.PI,TAU);ctx.stroke()};
hill(-2.35,-.5,.46,.55);hill(2.55,-.4,.58,.69);hill(.15,-1.9,.34,.37);
// thin atmospheric rim
ctx.save();ctx.globalCompositeOperation='screen';ctx.strokeStyle='rgba(169,204,241,.34)';ctx.lineWidth=1.2;ctx.beginPath();ctx.ellipse(c.x,c.y,rx*1.005,ry*1.005,-.09,Math.PI*1.03,Math.PI*1.97);ctx.stroke();ctx.restore()}
function drawOrbit(){let pts=[];for(let i=0;i<=120;i++){let a=i/120*TAU;pts.push([Math.cos(a)*5.1,.15+Math.sin(a)*.15,Math.sin(a)*3.9])}line3(pts,'rgba(204,196,169,.2)',.8);let p=project([Math.cos(t*.22)*5.1,.15,Math.sin(t*.22)*3.9]);ctx.fillStyle='#e9cf9b';ctx.shadowBlur=12;ctx.shadowColor='#e9cf9b';ctx.beginPath();ctx.arc(p.x,p.y,2.1,0,TAU);ctx.fill();ctx.shadowBlur=0}
function drawRose(o){const p=project(o.pos),s=p.s,u=s*.92;ctx.save();ctx.translate(p.x,p.y);ctx.shadowColor='rgba(236,161,173,.5)';ctx.shadowBlur=9;
/* glass cloche, a little imperfect like a handmade model */
ctx.beginPath();ctx.moveTo(-u*.44,u*.14);ctx.bezierCurveTo(-u*.43,-u*.08,-u*.34,-u*.53,0,-u*.58);ctx.bezierCurveTo(u*.34,-u*.53,u*.43,-u*.08,u*.44,u*.14);ctx.strokeStyle='rgba(210,231,239,.57)';ctx.lineWidth=Math.max(.8,u*.016);ctx.stroke();ctx.beginPath();ctx.ellipse(0,u*.14,u*.45,u*.075,0,0,TAU);ctx.fillStyle='rgba(191,215,224,.19)';ctx.fill();ctx.strokeStyle='rgba(225,237,239,.57)';ctx.stroke();ctx.beginPath();ctx.ellipse(-u*.2,-u*.2,u*.035,u*.14,-.24,0,TAU);ctx.strokeStyle='rgba(255,255,255,.28)';ctx.stroke();
ctx.shadowBlur=0;
/* stem and leaves */
ctx.strokeStyle='#8ea97d';ctx.lineWidth=Math.max(1,u*.035);ctx.beginPath();ctx.moveTo(0,u*.14);ctx.bezierCurveTo(-u*.04,0,u*.04,-u*.16,0,-u*.35);ctx.stroke();ctx.fillStyle='#839f73';ctx.beginPath();ctx.moveTo(-u*.02,0);ctx.quadraticCurveTo(-u*.36,-u*.18,-u*.31,u*.01);ctx.quadraticCurveTo(-u*.14,u*.08,-u*.02,0);ctx.fill();ctx.beginPath();ctx.moveTo(u*.01,-u*.13);ctx.quadraticCurveTo(u*.32,-u*.31,u*.28,-u*.12);ctx.quadraticCurveTo(u*.12,-u*.02,u*.01,-u*.13);ctx.fill();
/* layered rose petals */
const flowerY=-u*.37;ctx.save();ctx.translate(0,flowerY);for(let layer=0;layer<2;layer++){let n=layer?7:5;for(let i=0;i<n;i++){let a=i*TAU/n+(layer ? .22 : 0);ctx.save();ctx.rotate(a);let g=ctx.createLinearGradient(-u*.07,-u*.04,u*.08,u*.12);g.addColorStop(0,layer?'#f5b0aa':'#dc788d');g.addColorStop(1,layer?'#d97988':'#b95771');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,-u*(layer ? .105 : .075),u*(layer ? .082 : .112),u*(layer ? .12 : .14),0,0,TAU);ctx.fill();ctx.strokeStyle='rgba(255,218,194,.3)';ctx.lineWidth=.6;ctx.stroke();ctx.restore()}}ctx.fillStyle='#f3d18e';ctx.beginPath();ctx.arc(0,0,u*.055,0,TAU);ctx.fill();ctx.fillStyle='rgba(255,244,210,.8)';ctx.beginPath();ctx.arc(-u*.018,-u*.02,u*.018,0,TAU);ctx.fill();ctx.restore();
/* soft cast shadow and tiny dust motes */
ctx.fillStyle='rgba(11,17,29,.38)';ctx.beginPath();ctx.ellipse(0,u*.2,u*.46,u*.075,0,0,TAU);ctx.fill();ctx.fillStyle='rgba(255,225,170,.7)';ctx.beginPath();ctx.arc(u*.33,-u*.18,1.2,0,TAU);ctx.fill();ctx.restore()}
function drawPrince(o){const p=project(o.pos),s=p.s,u=s*1.13;ctx.save();ctx.translate(p.x,p.y);ctx.shadowColor='rgba(240,204,119,.28)';ctx.shadowBlur=7;
